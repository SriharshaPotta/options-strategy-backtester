[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osb"
version = "0.1.0"
description = "Options strategy backtester backed by a CUDA Monte Carlo pricing engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
package-dir = { "" = "backtester" }

[tool.setuptools.packages.find]
where = ["backtester"]

[tool.setuptools.package-data]
osb = ["*.pyd", "*.so"]

[tool.pytest.ini_options]
testpaths = ["backtester/tests", "api/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: frozen-dataclass and FastAPI Query defaults are intentional; B905: zips are over same-length legs
ignore = ["B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["osb", "api"]

